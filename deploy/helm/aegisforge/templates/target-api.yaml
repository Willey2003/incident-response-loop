apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisforge.fullname" . }}-target-api
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: target-api
    app.kubernetes.io/component: target-api
spec:
  replicas: {{ .Values.targetApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: target-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: target-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: target-api
        {{- include "aegisforge.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: target-api
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imagePrefix | default "aegisforge" }}/target-api:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "production" }}
        - name: LOG_LEVEL
          value: {{ .Values.global.logLevel | default "INFO" }}
        - name: TARGET_API_PORT
          value: "8080"
        - name: REDPANDA_BROKERS
          value: {{ include "aegisforge.fullname" . }}-redpanda:9092
        - name: REDPANDA_TOPIC_EVENTS
          value: security-events
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.global.observability.otelCollector.endpoint | default "http://otel-collector:4317" }}
        - name: OTEL_SERVICE_NAME
          value: target-api
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "aegisforge.fullname" . }}-jwt-secret
              key: jwt-secret
        - name: JWT_ALGORITHM
          value: HS256
        - name: JWT_EXPIRY_MINUTES
          value: "60"
        resources:
          {{- toYaml .Values.targetApi.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/aegisforge
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "aegisforge.fullname" . }}-target-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisforge.fullname" . }}-target-api
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: target-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app.kubernetes.io/name: target-api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisforge.fullname" . }}-target-api-config
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
data:
  config.yaml: |
    environment: production
    log_level: info
    log_format: json
    target_api_port: 8080
    redpanda_brokers: "{{ include "aegisforge.fullname" . }}-redpanda:9092"
    redpanda_topic_events: security-events
    jwt_secret_key: ""
    jwt_algorithm: HS256
    jwt_expiry_minutes: 60
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisforge.fullname" . }}-grafana
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: observability
        {{- include "aegisforge.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: "{{ .Values.global.imageRegistry }}/grafana/grafana:{{ .Values.global.observability.grafana.version | default "10.2.0" }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.global.observability.grafana.adminUser | default "admin" }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "aegisforge.fullname" . }}-grafana-secret
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        - name: GF_SERVER_ROOT_URL
          value: "http://{{ include "aegisforge.fullname" . }}-grafana.{{ include "aegisforge.namespace" . }}.svc.cluster.local:3000"
        - name: GF_SECURITY_COOKIE_SAMESITE
          value: "lax"
        resources:
          {{- toYaml .Values.global.observability.grafana.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: alerts
          mountPath: /etc/grafana/provisioning/alerting
          readOnly: true
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: alerts
          mountPath: /etc/grafana/provisioning/alerting
          readOnly: true
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: dashboards
        configMap:
          name: {{ include "aegisforge.fullname" . }}-grafana-dashboards
      - name: alerts
        configMap:
          name: {{ include "aegisforge.fullname" . }}-grafana-alerts
      - name: grafana-config
        configMap:
          name: {{ include "aegisforge.fullname" . }}-grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisforge.fullname" . }}-grafana
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisforge.fullname" . }}-grafana-config
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
data:
  grafana.ini: |
    [server]
    domain = {{ include "aegisforge.fullname" . }}-grafana.{{ include "aegisforge.namespace" . }}.svc.cluster.local
    root_url = %(protocol)s://%(domain)s:%(http_port)s/
    enforce_domain = false
    router_logging = true
    static_root_path = public
    
    [database]
    type = sqlite3
    path = /var/lib/grafana/grafana.db
    
    [security]
    admin_user = admin
    admin_password = admin
    secret_key = SW2YcwTIb9zpOOhoPsMm
    login_remember_days = 7
    cookie_username = grafana_user
    cookie_remember_name = grafana_remember
    disable_gravatar = true
    
    [auth]
    disable_login_form = false
    disable_signout_menu = false
    signout_redirect_url = /
    
    [auth.anonymous]
    enabled = false
    
    [auth.basic]
    enabled = true
    
    [auth.proxy]
    enabled = false
    
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    
    [log]
    mode = console
    level = info
    
    [metrics]
    enabled = true
    interval_seconds = 10
    
    [tracing.jaeger]
    enable = false
    
    [metrics.graphite]
    enable = false
    
    [metrics.prometheus]
    enable = true
    
    [snapshots]
    external_enabled = true
    external_snapshot_url = https://snapshots.raintank.io
    external_snapshot_name = Publish to snapshots.raintank.io
    
    [dashboards]
    versions_to_keep = 20
    min_refresh_interval = 5s
    
    [plugins]
    enable_alpha = false
    allow_loading_unsigned_plugins =
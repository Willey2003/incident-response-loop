apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisforge.fullname" . }}-falco
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aegisforge.fullname" . }}-falco
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aegisforge.fullname" . }}-falco
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "aegisforge.fullname" . }}-falco
  namespace: {{ include "aegisforge.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "aegisforge.fullname" . }}-falco
  apiGroup: rbac.authorization.k8s.io
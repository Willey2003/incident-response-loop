{{- if .Values.global.observability.grafana.alerts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisforge.fullname" . }}-grafana-alerts
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    grafana_alert_rule: "1"
data:
  alerts.yaml: |
    groups:
    - name: aegisforge-alerts
      rules:
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="{{ include "aegisforge.namespace" . }}"}[5m])) by (pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: "CPU usage on pod {{ $labels.pod }} is above 80%"
      
      - alert: HighMemoryUsage
        expr: sum(container_memory_usage_bytes{namespace="{{ include "aegisforge.namespace" . }}"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="{{ include "aegisforge.namespace" . }}"}) by (pod) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "Memory usage on pod {{ $labels.pod }} is above 85%"
      
      - alert: PodNotReady
        expr: kube_pod_status_ready{namespace="{{ include "aegisforge.namespace" . }}",condition="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has not been ready for 5 minutes"
      
      - alert: HighAlertVolume
        expr: sum(rate(alerts_total{namespace="{{ include "aegisforge.namespace" . }}"}[5m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High alert volume"
          description: "Alert volume is above 100 per minute"
      
      - alert: AIInferenceLatencyHigh
        expr: histogram_quantile(0.95, rate(ai_copilot_inference_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI inference latency high"
          description: "AI copilot inference latency is above 30 seconds"
      
      - alert: DetectionEngineDown
        expr: up{job="detection-engine"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Detection Engine is down"
          description: "Detection Engine has been down for more than 2 minutes"
      
      - alert: ResponseOrchestratorDown
        expr: up{job="response-orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Response Orchestrator is down"
          description: "Response Orchestrator has been down for more than 2 minutes"
      
      - alert: AICopilotDown
        expr: up{job="ai-copilot"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI Copilot is down"
          description: "AI Copilot has been down for more than 2 minutes"
      
      - alert: EmulationControllerDown
        expr: up{job="emulation-controller"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Emulation Controller is down"
          description: "Emulation Controller has been down for more than 2 minutes"
      
      - alert: RedpandaDown
        expr: up{job="redpanda"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redpanda is down"
          description: "Redpanda message broker has been down for more than 2 minutes"
      
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 2 minutes"
      
      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant is down"
          description: "Qdrant vector database has been down for more than 2 minutes"
      
      - alert: OllamaDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ollama is down"
          description: "Ollama LLM inference service has been down for more than 2 minutes"
      
      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MinIO is down"
          description: "MinIO object storage has been down for more than 2 minutes"
      
      - alert: QdrantDiskSpaceLow
        expr: (qdrant_disk_space_bytes - qdrant_disk_free_bytes) / qdrant_disk_space_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant disk space low"
          description: "Qdrant disk usage is above 90%"
      
      - alert: MinIODiskSpaceLow
        expr: (minio_disk_total_bytes - minio_disk_free_bytes) / minio_disk_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MinIO disk space low"
          description: "MinIO disk usage is above 90%"
      
      - alert: PostgreSQLDiskSpaceLow
        expr: (pg_database_size_bytes('aegisforge') / 1024 / 1024 / 1024) > 40
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL disk space low"
          description: "PostgreSQL database size is above 40GB"
      
      - alert: HighAIInferenceLatency
        expr: histogram_quantile(0.95, rate(ai_copilot_inference_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI inference latency high"
          description: "AI copilot inference latency is above 30 seconds"
      
      - alert: HighAlertVolume
        expr: sum(rate(alerts_total{namespace="{{ include "aegisforge.namespace" . }}"}[5m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High alert volume"
          description: "Alert volume is above 100 per minute"
      
      - alert: ResponseActionFailureRateHigh
        expr: sum(rate(response_actions_failed_total[5m])) / sum(rate(response_actions_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Response action failure rate high"
          description: "Response action failure rate is above 10%"
{{- end }}
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-response-test
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "incident-response/test=true"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
    protocol: TCP
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP
- role: worker
  labels:
    incident-response/worker: "true"
- role: worker
  labels:
    incident-response/worker: "true"
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  kubeProxyMode: "ipvs"
featureGates:
  "SidecarContainers": true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisforge.fullname" . }}-dns-simulator
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: dns-simulator
    app.kubernetes.io/component: simulator
spec:
  replicas: {{ .Values.dnsSimulator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-simulator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-simulator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: simulator
        {{- include "aegisforge.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: dns-simulator
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imagePrefix | default "aegisforge" }}/dns-simulator:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "production" }}
        - name: LOG_LEVEL
          value: {{ .Values.global.logLevel | default "INFO" }}
        - name: SIMULATOR_INTERVAL
          value: "{{ .Values.global.simulators.interval | default "30" }}"
        - name: SIMULATOR_BATCH_SIZE
          value: "{{ .Values.global.simulators.batchSize | default "10" }}"
        - name: REDPANDA_BROKERS
          value: {{ include "aegisforge.fullname" . }}-redpanda:9092
        - name: REDPANDA_TOPIC_EVENTS
          value: security-events
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.global.observability.otelCollector.endpoint | default "http://otel-collector:4317" }}
        - name: OTEL_SERVICE_NAME
          value: dns-simulator
        resources:
          {{- toYaml .Values.dnsSimulator.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisforge.fullname" . }}-dns-simulator
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
    app.kubernetes.io/name: dns-simulator
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app.kubernetes.io/name: dns-simulator
    app.kubernetes.io/instance: {{ .Release.Name }}
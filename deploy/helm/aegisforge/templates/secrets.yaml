apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-postgres-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.global.database.postgresql.username | default "aegisforge" }}
  password: {{ .Values.global.database.postgresql.password | default "changeme_dev_only" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-jwt-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.global.auth.jwtSecretKey | default "dev-secret-change-in-production" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-grafana-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.global.observability.grafana.adminPassword | default "admin" }}
---
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-keycloak-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.keycloak.adminPassword | default "admin" }}
  db-username: {{ .Values.keycloak.dbUsername | default "keycloak" }}
  db-password: {{ .Values.keycloak.dbPassword | default "keycloak" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-redis-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.redis.password | default "redis-password-change-me" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-minio-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.global.objectStorage.minio.accessKey | default "minioadmin" }}
  secret-key: {{ .Values.global.objectStorage.minio.secretKey | default "minioadmin" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-jwt-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.global.auth.jwtSecretKey | default "dev-secret-change-in-production" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisforge.fullname" . }}-keycloak-secret
  namespace: {{ include "aegisforge.namespace" . }}
  labels:
    {{- include "aegisforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.keycloak.adminPassword | default "admin" }}
  db-username: {{ .Values.keycloak.dbUsername | default "keycloak" }}
  db-password: {{ .Values.keycloak.dbPassword | default "keycloak" }}